name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --workspace=mobile
        working-directory: .
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: node --experimental-strip-types --test supabase/functions/_shared/lock-decision.test.ts supabase/functions/_shared/join-payment-flow.test.ts supabase/functions/_shared/payment-hotfix.test.ts
        working-directory: ${{ github.workspace }}
